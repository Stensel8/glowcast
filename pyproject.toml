[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glowcast"
version = "0.1.0"
description = "Sync your Philips Hue lights with your screen, games and music, on Linux"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sten T. (Stensel8)"},
    {name = "Engin Kırmacı (Lumux)"},
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PyGObject>=3.50",
    "numpy>=2.0",
]

[project.scripts]
glowcast = "glowcast.__main__:main"

[project.urls]
Homepage = "https://github.com/Stensel8/glowcast"
Issues = "https://github.com/Stensel8/glowcast/issues"

# --- src layout: find packages under src/ ---
[tool.setuptools]
py-modules = []   # No root-level modules
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.stensel8.glowcast.desktop"]
"share/metainfo" = ["data/io.github.stensel8.glowcast.metainfo.xml"]
"share/icons/hicolor/scalable/apps" = ["flatpak/io.github.stensel8.glowcast.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E402",   # gi.require_version() must run before importing from gi.repository
    "B905",   # zip(strict=...) adds noise for equal-length pairs
    "RUF001", # en dashes and the like in user-facing text are intended
    "RUF012", # GObject declares signals and properties as class dicts
]
