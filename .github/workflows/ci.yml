name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs and images to digests; Dependabot and
# Renovate keep them current (see .github/dependabot.yml and renovate.json).
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - run: pip install -r requirements-dev.txt
      - run: ruff check
      - run: ruff format --check

  # Fedora ships current Python, PyGObject and GStreamer as packages. Each job
  # pins the Fedora release whose Python it tests.
  test-py314:
    name: test (Python 3.14, as in the Flatpak)
    runs-on: ubuntu-latest
    container: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: >
          dnf install -y --setopt=install_weak_deps=False
          python3 python3-pip python3-gobject python3-numpy
          gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good
          openssl coreutils
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest -q

  test-py315:
    name: test (Python 3.15)
    runs-on: ubuntu-latest
    container: fedora:45@sha256:aacbc26b38361ba0cb3d10f268da40b61b36aed6ed6fe5831a35871636bedb06
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: >
          dnf install -y --setopt=install_weak_deps=False
          python3 python3-pip python3-gobject python3-numpy
          gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good
          openssl coreutils
      - run: pip install -r requirements-dev.txt
      - run: python3 -m pytest -q

  flatpak:
    runs-on: ubuntu-latest
    container:
      # Same GNOME version as runtime-version in the manifest
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: glowcast.flatpak
          manifest-path: flatpak/io.github.stensel8.glowcast.yml
          cache-key: flatpak-builder-${{ github.sha }}
