<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Glowcast</title>
  <defs>
    <linearGradient id="face" x1="20" y1="4" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="0.33" stop-color="#ff3d6e"/>
      <stop offset="0.67" stop-color="#b13cf5"/>
      <stop offset="1" stop-color="#4f5bff"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a3304a"/>
      <stop offset="1" stop-color="#3a2a9e"/>
    </linearGradient>
    <radialGradient id="halo" cx="64" cy="45" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="2" result="offset"/>
      <feFlood flood-color="#2a0b4d" flood-opacity="0.35"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- The bulb: an A60 pear-shaped glass on an E27 screw base, with a highlight cut out of the glass -->
    <mask id="bulb" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <g fill="#fff">
        <path d="M64 21.5 A23.5 23.5 0 0 1 87.5 45 C87.5 57 77.5 64.5 76.5 73 L76.5 77 H51.5 L51.5 73 C50.5 64.5 40.5 57 40.5 45 A23.5 23.5 0 0 1 64 21.5 Z"/>
        <rect x="50.5" y="79" width="27" height="4.5" rx="2"/>
        <rect x="51" y="85.5" width="26" height="4.5" rx="2.25" transform="rotate(-7 64 87.75)"/>
        <rect x="51.5" y="92" width="25" height="4.5" rx="2.25" transform="rotate(-7 64 94.25)"/>
        <path d="M57.5 98.5 h13 l-2 4.5 a4.5 3 0 0 1 -9 0 z"/>
      </g>
      <path d="M50 36 A17 17 0 0 1 60 28.5" stroke="#000" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>
  <!-- Tile: depth edge, gradient face, soft glow behind the bulb -->
  <rect x="10" y="14" width="108" height="104" rx="24" fill="url(#side)"/>
  <rect x="10" y="10" width="108" height="104" rx="24" fill="url(#face)"/>
  <rect x="10" y="10" width="108" height="104" rx="24" fill="url(#halo)"/>
  <g filter="url(#shadow)">
    <rect width="128" height="128" fill="#fff" mask="url(#bulb)"/>
  </g>
</svg>
