app-id: io.github.stensel8.glowcast
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: glowcast

finish-args:
  # UI (Wayland only)
  - --socket=wayland
  - --device=dri

  # Hue bridge discovery + control
  - --share=network

  # Screen capture needs no permission: the ScreenCast portal hands out a
  # PipeWire connection limited to the monitor the user picked.

  # Music mode listens to the speaker output (@DEFAULT_MONITOR@); there is no
  # portal for audio capture.
  - --socket=pulseaudio

  # System tray support via StatusNotifierItem (D-Bus)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/man
  - /share/doc
  - /share/gtk-doc

modules:
  # Python dependencies (offline, generated by flatpak-pip-generator)
  - python3-modules.json

  - name: glowcast
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
      - install -Dm644 data/io.github.stensel8.glowcast.desktop /app/share/applications/io.github.stensel8.glowcast.desktop
      - install -Dm644 data/io.github.stensel8.glowcast.metainfo.xml /app/share/metainfo/io.github.stensel8.glowcast.metainfo.xml
      - install -Dm644 flatpak/io.github.stensel8.glowcast.svg /app/share/icons/hicolor/scalable/apps/io.github.stensel8.glowcast.svg
    sources:
      - type: dir
        path: ..
